[project]
name = "wc-cli"
version = "0.1.0"
description = "CLI utility: count lines, words and characters in files (stdlib only)"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
wc-cli = "wc_cli.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.9.0",
    "ty>=0.0.1",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wc_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
]
